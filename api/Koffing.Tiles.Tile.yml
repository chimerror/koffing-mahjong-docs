    startLine: 215
  assemblies:
  - Koffing
  namespace: Koffing.Tiles
  summary: >-
    Compares the current instance with another object of the same type and returns an integer that indicates whether

    the current instance precedes, follows, or occurs in the same position in the sort order as the other object.
  remarks: >-
    Comparison is done by comparing:


    <ol><li>
    		if <code class="paramref">that</code> is null (always 1)
    	</li><li>
    		<xref href="Koffing.Tiles.Tile.Suit" data-throw-if-not-resolved="false"></xref>
    	</li><li>
    		<xref href="Koffing.Tiles.Tile.Rank" data-throw-if-not-resolved="false"></xref>, accounting for placing rank 0 (red five) after rank 5.
    	</li></ol>
  example: []
  syntax:
    content: public int CompareTo(Tile that)
    parameters:
    - id: that
      type: Koffing.Tiles.Tile
      description: A <xref href="Koffing.Tiles.Tile" data-throw-if-not-resolved="false"></xref> to compare with this instance.
    return:
      type: System.Int32
      description: >-
        A value that indicates the relative order of the objects being compared. The return value has these meanings:


        <table><thead><tr><th class="term">Value</th><th class="description">Meaning</th></tr></thead><tbody><tr><td class="term">Less than zero</td><td class="description">This instance precedes <code class="paramref">that</code> in the sort order.</td></tr><tr><td class="term">Zero</td><td class="description">
        			This instance occurs in the same position in the sort order as <code class="paramref">that</code>.
        		</td></tr><tr><td class="term">Greater than zero</td><td class="description">This instance follows <code class="paramref">that</code> in the sort order.</td></tr></tbody></table>
    content.vb: Public Function CompareTo(that As Tile) As Integer
  overload: Koffing.Tiles.Tile.CompareTo*
  implements:
  - System.IComparable{Koffing.Tiles.Tile}.CompareTo(Koffing.Tiles.Tile)
