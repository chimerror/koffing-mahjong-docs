  assemblies:
  - Koffing
  namespace: Koffing.Tiles
  summary: Returns if a given suit and rank combination corresponds to a valid tile.
  example: []
  syntax:
    content: public static bool IsValidTile(Suit suit, int rank)
    parameters:
    - id: suit
      type: Koffing.Tiles.Suit
      description: The suit to check.
    - id: rank
      type: System.Int32
      description: The rank to check.
    return:
      type: System.Boolean
      description: >-
        If <code class="paramref">suit</code> is <xref href="Koffing.Tiles.Suit.Zi" data-throw-if-not-resolved="false"></xref> and <code class="paramref">rank</code> is 1-7, returns

        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>. If <code class="paramref">suit</code> is any other suit, and <code class="paramref">rank</code> is 0-9, returns

        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>. Otherwise, returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
