  - vb
  name: Match(IRandomNumberGenerator, PlayerCount, bool, int)
  nameWithType: Match.Match(IRandomNumberGenerator, PlayerCount, bool, int)
  fullName: Koffing.Matches.Match.Match(Koffing.Random.IRandomNumberGenerator, Koffing.Matches.PlayerCount, bool, int)
  type: Constructor
  source:
    remote:
      path: Scripts/Matches/Match.cs
      branch: main
      repo: https://github.com/chimerror/koffing.git
    id: .ctor
    path: ../Koffing/Scripts/Matches/Match.cs
    startLine: 83
  assemblies:
  - Koffing
  namespace: Koffing.Matches
  summary: >-
    Constructor. Creates a new match using the specified <xref href="Koffing.Random.IRandomNumberGenerator" data-throw-if-not-resolved="false"></xref> with

    <xref href="Koffing.Matches.Match.PlayerCount" data-throw-if-not-resolved="false"></xref> players, whether to use red fives, and the number of rounds in the match.
  remarks: >-
    After this constructor returns, the match will have an initial wall created and broken (as part of the

    <xref href="Koffing.Matches.Wall" data-throw-if-not-resolved="false"></xref> constructor), the players at random indices, and a random player chosen as east. However, no

    tiles will be dealt to players yet.
  example: []
  syntax:
    content: public Match(IRandomNumberGenerator rng, PlayerCount playerCount, bool hasRedFives, int numberOfRounds = 2)
    parameters:
    - id: rng
      type: Koffing.Random.IRandomNumberGenerator
      description: The <xref href="Koffing.Random.IRandomNumberGenerator" data-throw-if-not-resolved="false"></xref> to use for random numbers.
    - id: playerCount
      type: Koffing.Matches.PlayerCount
      description: The number of players in the match as a <xref href="Koffing.Matches.Match.PlayerCount" data-throw-if-not-resolved="false"></xref>.
    - id: hasRedFives
      type: System.Boolean
      description: Whether or not red fives should be used.
    - id: numberOfRounds
      type: System.Int32
      description: The number of rounds in the match. If not specified, defaults to 2.
    content.vb: Public Sub New(rng As IRandomNumberGenerator, playerCount As PlayerCount, hasRedFives As Boolean, numberOfRounds As Integer = 2)
  overload: Koffing.Matches.Match.#ctor*
  nameWithType.vb: Match.New(IRandomNumberGenerator, PlayerCount, Boolean, Integer)
  fullName.vb: Koffing.Matches.Match.New(Koffing.Random.IRandomNumberGenerator, Koffing.Matches.PlayerCount, Boolean, Integer)
  name.vb: New(IRandomNumberGenerator, PlayerCount, Boolean, Integer)
