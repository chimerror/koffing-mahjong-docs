  commentId: M:Koffing.Blocks.Block.CompareTo(Koffing.Blocks.Block)
  id: CompareTo(Koffing.Blocks.Block)
  parent: Koffing.Blocks.Block
  langs:
  - csharp
  - vb
  name: CompareTo(Block)
  nameWithType: Block.CompareTo(Block)
  fullName: Koffing.Blocks.Block.CompareTo(Koffing.Blocks.Block)
  type: Method
  source:
    remote:
      path: Scripts/Blocks/Block.cs
      branch: main
      repo: https://github.com/chimerror/koffing.git
    id: CompareTo
    path: ../Koffing/Scripts/Blocks/Block.cs
    startLine: 391
  assemblies:
  - Koffing
  namespace: Koffing.Blocks
  summary: >-
    Compares the current instance with another object of the same type and returns an integer that indicates whether

    the current instance precedes, follows, or occurs in the same position in the sort order as the other object.
  remarks: >-
    Comparison is done by comparing:


    <ol><li>
    		if <code class="paramref">that</code> is null (always 1)
    	</li><li>
    		type (using <xref href="Koffing.Blocks.IBlock.GetHashCodeBasis" data-throw-if-not-resolved="false"></xref>)
    	</li><li>
    		the number of tiles in the block
    	</li><li>
    		the actual tiles in the block (after sorting) using <xref href="Koffing.Tiles.Tile.CompareTo(Koffing.Tiles.Tile)" data-throw-if-not-resolved="false"></xref>.
    	</li></ol>
  example: []
  syntax:
    content: public int CompareTo(Block that)
    parameters:
    - id: that
      type: Koffing.Blocks.Block
      description: A <xref href="Koffing.Blocks.Block" data-throw-if-not-resolved="false"></xref> to compare with this instance.
    return:
      type: System.Int32
      description: >-
        A value that indicates the relative order of the objects being compared. The return value has these meanings:


        <table><thead><tr><th class="term">Value</th><th class="description">Meaning</th></tr></thead><tbody><tr><td class="term">Less than zero</td><td class="description">This instance precedes <code class="paramref">that</code> in the sort order.</td></tr><tr><td class="term">Zero</td><td class="description">
        			This instance occurs in the same position in the sort order as <code class="paramref">that</code>.
        		</td></tr><tr><td class="term">Greater than zero</td><td class="description">This instance follows <code class="paramref">that</code> in the sort order.</td></tr></tbody></table>
    content.vb: Public Function CompareTo(that As Block) As Integer
  overload: Koffing.Blocks.Block.CompareTo*
  implements:
  - System.IComparable{Koffing.Blocks.Block}.CompareTo(Koffing.Blocks.Block)
