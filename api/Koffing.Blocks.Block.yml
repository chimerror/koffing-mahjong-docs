    parameters:
    - id: thatBlock
      type: Koffing.Blocks.Block
      description: The <xref href="Koffing.Blocks.Block" data-throw-if-not-resolved="false"></xref> to compare with the current object.
    return:
      type: System.Boolean
      description: >-
        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the current object is equal to the <code class="paramref">thatBlock</code> parameter; otherwise,

        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
    content.vb: Public Overridable Function Equals(thatBlock As Block) As Boolean
