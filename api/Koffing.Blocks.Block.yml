  type: Method
  source:
    remote:
      path: Scripts/Blocks/Block.cs
      branch: main
      repo: https://github.com/chimerror/koffing.git
    id: GetPossibleHelper
    path: ../Koffing/Scripts/Blocks/Block.cs
    startLine: 162
  assemblies:
  - Koffing
  namespace: Koffing.Blocks
  summary: >-
    Protected static helper function that can be used to simplify overrides of

    <xref href="Koffing.Blocks.IBlock.GetPossible(System.Collections.Generic.IEnumerable%7bKoffing.Tiles.Tile%7d)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Most derived blocks have their logic for the <xref href="Koffing.Blocks.IBlock.GetPossible(System.Collections.Generic.IEnumerable%7bKoffing.Tiles.Tile%7d)" data-throw-if-not-resolved="false"></xref> function

    implemented as an override of <xref href="Koffing.Blocks.IBlock.GetPossibleForTile(Koffing.Tiles.Tile%2cSystem.Collections.Generic.IEnumerable%7bKoffing.Tiles.Tile%7d)" data-throw-if-not-resolved="false"></xref>, as it is

    often easier to write logic around a single given tile. Rather than duplicating the logic to go through all

    distinct tiles and calling <xref href="Koffing.Blocks.IBlock.GetPossibleForTile(Koffing.Tiles.Tile%2cSystem.Collections.Generic.IEnumerable%7bKoffing.Tiles.Tile%7d)" data-throw-if-not-resolved="false"></xref> for each one,

    this function can be used instead.
  example:
  - >-
    As an example of such an override taken from <xref href="Koffing.Melds.Chow.GetPossible(System.Collections.Generic.IEnumerable%7bKoffing.Tiles.Tile%7d)" data-throw-if-not-resolved="false"></xref>:


    <pre><code class="lang-csharp">public static new IEnumerable&lt;MadeBlockContext&gt; GetPossible(IEnumerable&lt;Tile&gt; tiles)

    {
    	return GetPossibleHelper(tiles, typeof(Chow)).Distinct();
    }</code></pre>


    Note that the call to <xref href="System.Linq.Enumerable.Distinct%60%601(System.Collections.Generic.IEnumerable%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref> is necessary, as this

    function does not do it itself.
  syntax:
    content: protected static IEnumerable<MadeBlockContext> GetPossibleHelper(IEnumerable<Tile> tiles, Type blockType)
    parameters:
    - id: tiles
      type: System.Collections.Generic.IEnumerable{Koffing.Tiles.Tile}
      description: The <xref href="Koffing.Tiles.Tile" data-throw-if-not-resolved="false"></xref>s to use to create <xref href="Koffing.Blocks.MadeBlockContext" data-throw-if-not-resolved="false"></xref>s.
    - id: blockType
      type: System.Type
      description: The <xref href="System.Type" data-throw-if-not-resolved="false"></xref> of block to return.
    return:
      type: System.Collections.Generic.IEnumerable{Koffing.Blocks.MadeBlockContext}
      description: An <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> of <xref href="Koffing.Blocks.MadeBlockContext" data-throw-if-not-resolved="false"></xref>s of type <code class="paramref">blockType</code>.
    content.vb: Protected Shared Function GetPossibleHelper(tiles As IEnumerable(Of Tile), blockType As Type) As IEnumerable(Of MadeBlockContext)
  overload: Koffing.Blocks.Block.GetPossibleHelper*
  nameWithType.vb: Block.GetPossibleHelper(IEnumerable(Of Tile), Type)
  fullName.vb: Koffing.Blocks.Block.GetPossibleHelper(System.Collections.Generic.IEnumerable(Of Koffing.Tiles.Tile), System.Type)
  name.vb: GetPossibleHelper(IEnumerable(Of Tile), Type)
