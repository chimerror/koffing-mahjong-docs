  assemblies:
  - Koffing
  namespace: Koffing.Blocks
  summary: Constructor. Optionally takes in an <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> of <xref href="Koffing.Tiles.Tile" data-throw-if-not-resolved="false"></xref>s.
  remarks: >-
    <p>
    	In general, this (and the other constructors for derived classes) should not be used in favor of using
    	<xref href="Koffing.Blocks.IBlock" data-throw-if-not-resolved="false"></xref> static functions such as <xref href="Koffing.Blocks.IBlock.GetPossible(System.Collections.Generic.IEnumerable%7bKoffing.Tiles.Tile%7d)" data-throw-if-not-resolved="false"></xref> or the
    	<xref href="Koffing.Blocks.Block.GetPossibleBlockSets(System.Collections.Generic.IEnumerable%7bKoffing.Tiles.Tile%7d)" data-throw-if-not-resolved="false"></xref> static helper function.
    </p>

    <p>
    	Those methods will ensure that Blocks created correctly match their intended semantic meaning, such as
    	<xref href="Koffing.Melds.Pung" data-throw-if-not-resolved="false"></xref>s having all the same tile or <xref href="Koffing.Melds.Chow" data-throw-if-not-resolved="false"></xref>s having a sequence of tiles in the same
    	suit.
    </p>
  example: []
  syntax:
    content: public Block(IEnumerable<Tile> tiles = null)
    parameters:
    - id: tiles
      type: System.Collections.Generic.IEnumerable{Koffing.Tiles.Tile}
      description: The <xref href="Koffing.Tiles.Tile" data-throw-if-not-resolved="false"></xref>s that make up the block.
