  assemblies:
  - Koffing
  namespace: Koffing.Blocks
  summary: Abstract class representing a grouping of <xref href="Koffing.Tiles.Tile" data-throw-if-not-resolved="false"></xref>s.
  remarks: >-
    A block is a very generic grouping of <xref href="Koffing.Tiles.Tile" data-throw-if-not-resolved="false"></xref>s. This should be the root class for all derived blocks as

    it provides some basic implementations of the major interfaces of <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref>,

    <xref href="Koffing.Blocks.IBlock" data-throw-if-not-resolved="false"></xref>, <xref href="System.IComparable%601" data-throw-if-not-resolved="false"></xref>, and <xref href="System.IEquatable%601" data-throw-if-not-resolved="false"></xref>.
