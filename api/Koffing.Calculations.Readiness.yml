    algorithm, which assumes the valid complete hand will be made up of four <xref href="Koffing.Melds.Meld" data-throw-if-not-resolved="false"></xref>s of 3 tiles, and a

    <xref href="Koffing.Melds.Pair" data-throw-if-not-resolved="false"></xref>.
