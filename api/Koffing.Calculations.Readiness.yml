  assemblies:
  - Koffing
  namespace: Koffing.Calculations
  summary: Functions for calculating the readiness of a hand (a <xref href="Koffing.Blocks.BlockSet" data-throw-if-not-resolved="false"></xref>).
  remarks: >-
    <p>

    A hand being "ready" means that there is one tile remaining to make a valid complete hand of 14 tiles. This means

    either four <xref href="Koffing.Melds.Meld" data-throw-if-not-resolved="false"></xref>s of 3 tiles each and a <xref href="Koffing.Melds.Pair" data-throw-if-not-resolved="false"></xref> (standard readiness) or one of the special

    hand patterns of seven pairs/thirteen orphans. Note that a hand may be valid and complete but lack yaku, and thus

    not be a hand that a player can go out on.

    </p>

    <p>

    For ease of calculation, all the readiness functions expect a <xref href="Koffing.Blocks.BlockSet" data-throw-if-not-resolved="false"></xref>, so that it can use the

    semantic knowledge contained in the derived classes of <xref href="Koffing.Blocks.Block" data-throw-if-not-resolved="false"></xref> (like <xref href="Koffing.Melds.Meld" data-throw-if-not-resolved="false"></xref> and

    <xref href="Koffing.Waits.Wait" data-throw-if-not-resolved="false"></xref>). Given an <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref>, use

    <xref href="Koffing.Blocks.Block.GetPossibleBlockSets(System.Collections.Generic.IEnumerable%7bKoffing.Tiles.Tile%7d)" data-throw-if-not-resolved="false"></xref> to then feed the possible BlockSets into these

    functions.

    </p>
  example: []
  syntax:
    content: public static class Readiness
