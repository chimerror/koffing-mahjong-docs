  assemblies:
  - Koffing
  namespace: Koffing.Calculations
  summary: >-
    Returns whether the current hand is past ready, that is, having a hand with more than enough tiles to be ready.

    It also returns the readiness algorithm used for calculation.
  remarks: >-
    Note that this may or may not be the same as a "valid complete" hand. This function does not consider if all

    <xref href="Koffing.Blocks.Block" data-throw-if-not-resolved="false"></xref>s in the <xref href="Koffing.Blocks.BlockSet" data-throw-if-not-resolved="false"></xref> are not a <xref href="Koffing.Waits.Wait" data-throw-if-not-resolved="false"></xref> or <xref href="Koffing.Waits.Orphan" data-throw-if-not-resolved="false"></xref>, nor

    that there are only 14 tiles.
  example: []
  syntax:
    content: public static bool IsPastReady(this BlockSet hand, out Readiness.Type chosenReadinessType)
    parameters:
    - id: hand
      type: Koffing.Blocks.BlockSet
      description: The hand to analyze as a <xref href="Koffing.Blocks.BlockSet" data-throw-if-not-resolved="false"></xref>.
    - id: chosenReadinessType
      type: Koffing.Calculations.Readiness.Type
      description: Will contain a <xref href="Koffing.Calculations.Readiness.Type" data-throw-if-not-resolved="false"></xref> indicating the readiness algorithm used after returning.
    return:
      type: System.Boolean
      description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>, if the hand is ready, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> otherwise.
    content.vb: Public Shared Function IsPastReady(hand As BlockSet, chosenReadinessType As Readiness.Type) As Boolean
