    id: GetFirstLevelMelds
    path: ../Koffing/Scripts/Melds/Meld.cs
    startLine: 33
  assemblies:
  - Koffing
  namespace: Koffing.Melds
  summary: Returns all possible first-level melds from a collection of <xref href="Koffing.Tiles.Tile" data-throw-if-not-resolved="false"></xref>s.
  remarks: >-
    A "first-level" meld is a single <xref href="Koffing.Melds.Chow" data-throw-if-not-resolved="false"></xref>, <xref href="Koffing.Melds.Pung" data-throw-if-not-resolved="false"></xref>, or <xref href="Koffing.Melds.Kong" data-throw-if-not-resolved="false"></xref> that can be made

    from <code class="paramref">tiles</code>. Note that this does not include <xref href="Koffing.Melds.Pair" data-throw-if-not-resolved="false"></xref>s. Instead,

    <xref href="Koffing.Waits.Wait.GetFirstLevelWaits(System.Collections.Generic.IEnumerable%7bKoffing.Tiles.Tile%7d)" data-throw-if-not-resolved="false"></xref> will generate first-level <xref href="Koffing.Waits.PairWait" data-throw-if-not-resolved="false"></xref>s,

    which can be explicitly cast to <xref href="Koffing.Melds.Pair" data-throw-if-not-resolved="false"></xref>s.
  example: []
  syntax:
    content: public static IEnumerable<MadeBlockContext> GetFirstLevelMelds(IEnumerable<Tile> tiles)
    parameters:
    - id: tiles
      type: System.Collections.Generic.IEnumerable{Koffing.Tiles.Tile}
      description: The <xref href="Koffing.Tiles.Tile" data-throw-if-not-resolved="false"></xref>s to use to create <xref href="Koffing.Blocks.MadeBlockContext" data-throw-if-not-resolved="false"></xref>s of first-level melds.
    return:
      type: System.Collections.Generic.IEnumerable{Koffing.Blocks.MadeBlockContext}
      description: >-
        An <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> of <xref href="Koffing.Blocks.MadeBlockContext" data-throw-if-not-resolved="false"></xref>s of first-level melds that can be created from

        <code class="paramref">tiles</code>.
    content.vb: Public Shared Function GetFirstLevelMelds(tiles As IEnumerable(Of Tile)) As IEnumerable(Of MadeBlockContext)
  overload: Koffing.Melds.Meld.GetFirstLevelMelds*
  nameWithType.vb: Meld.GetFirstLevelMelds(IEnumerable(Of Tile))
  fullName.vb: Koffing.Melds.Meld.GetFirstLevelMelds(System.Collections.Generic.IEnumerable(Of Koffing.Tiles.Tile))
  name.vb: GetFirstLevelMelds(IEnumerable(Of Tile))
