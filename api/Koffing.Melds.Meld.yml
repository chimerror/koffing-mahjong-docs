  nameWithType: Meld.GetFirstLevelMelds(IEnumerable<Tile>)
  fullName: Koffing.Melds.Meld.GetFirstLevelMelds(System.Collections.Generic.IEnumerable<Koffing.Tiles.Tile>)
  type: Method
  source:
    remote:
      path: Scripts/Melds/Meld.cs
