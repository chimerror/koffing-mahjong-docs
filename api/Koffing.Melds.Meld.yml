  assemblies:
  - Koffing
  namespace: Koffing.Melds
  summary: An abstract derived <xref href="Koffing.Blocks.Block" data-throw-if-not-resolved="false"></xref> with the semantic meaning of being a "completed" part of a hand.
  remarks: >-
    A meld is a <xref href="Koffing.Blocks.Block" data-throw-if-not-resolved="false"></xref> that does not need any additional tiles to be a useful part of a hand, compared to

    a <xref href="Koffing.Waits.Wait" data-throw-if-not-resolved="false"></xref>, which is incomplete, and would become a meld given additional tiles.
  example: []
  syntax:
    content: 'public abstract class Meld : Block, IEnumerable<Tile>, IEnumerable, IBlock, IComparable<Block>, IEquatable<Block>'
    content.vb: Public MustInherit Class Meld Inherits Block Implements IEnumerable(Of Tile), IEnumerable, IBlock, IComparable(Of Block), IEquatable(Of Block)
