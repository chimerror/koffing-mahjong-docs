  assemblies:
  - Koffing
  namespace: Koffing.Melds
  summary: >-
    Get the hash code basis representing this block type, which will be exponentiated as a part of calculating

    <xref href="System.Object.GetHashCode" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The number returned here should be a unique prime number among all derived <xref href="Koffing.Blocks" data-throw-if-not-resolved="false"></xref> to ensure proper

    hashing. The current set of numbers is verified in

    <xref href="Koffing.Tests.BlockTests.GetBlockHashCodeIsCorrect(Koffing.Blocks.Block%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static int GetHashCodeBasis()
    return:
      type: System.Int32
      description: The basis to use when calculating hash codes for this block type.
    content.vb: Public Shared Function GetHashCodeBasis() As Integer
  overload: Koffing.Melds.Pung.GetHashCodeBasis*
